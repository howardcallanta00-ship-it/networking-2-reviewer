<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CCNA 2 Reviewer</title>
  <meta name="description" content="Unofficial CCNA 2 v7 (SRWE) study tool: practice, exam simulation and flashcards for Modules 1–16.">
  <meta name="theme-color" content="#0B1B3A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CCNA 2">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <!-- The ?v3 suffix must match VERSION in sw.js; bump both when the files change. -->
  <link rel="stylesheet" href="styles.css?v3">
  <link rel="preload" href="data/questions.json" as="fetch" crossorigin>
  <script>
    try { var t = localStorage.getItem('ccna2r:theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <div id="app"><p class="empty">Loading questions…</p></div>
  <noscript><p class="empty">This reviewer needs JavaScript turned on.</p></noscript>
  <script src="app.js?v3"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
